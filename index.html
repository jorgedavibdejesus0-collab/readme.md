<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Alunos</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <main class="container">
    <h1>Cadastro de Alunos</h1>

    <form id="formulario">
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" placeholder="Digite o nome do aluno" required>
      </div>

      <div class="campo">
        <label for="matricula">Matrícula</label>
        <input type="text" id="matricula" placeholder="Ex.: 2026001" required>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" id="email" placeholder="aluno@email.com" required>
      </div>

      <div class="campo">
        <label for="nascimento">Data de nascimento</label>
        <input type="date" id="nascimento" required>
      </div>

      <button type="submit" class="botao-cadastrar">Cadastrar aluno</button>
    </form>

    <p id="mensagem" class="mensagem"></p>

    <section class="lista-alunos">
      <h2>Alunos cadastrados</h2>
      <p id="sem-alunos">Nenhum aluno cadastrado.</p>
      <ul id="lista"></ul>
    </section>

    <section class="contador-cliques">
      <h2>Botão interativo</h2>
      <button id="botao" type="button">Clique em mim</button>
      <p id="contador">Nenhum clique ainda.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
